<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>六选五 · 用户管理</title>
<style>
/* 独立页面，不引游戏样式：游戏那套是 750px 定宽舞台 + overflow:hidden，
 * 管理后台要的是可滚动的长列表，硬套只会互相打架。配色和质感保持同一套。 */
:root {
  --green-deep: #0F2B22;
  --green-mid: #16382F;
  --gold: #F5C15C;
  --gold-light: #FFE08A;
  --gray-aux: #B8C0CC;
  --up-red: #FF5D5D;
  --down-green: #3DDC84;
  --warm-white: #FFF7E8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 20px 60px;
  background: var(--green-deep) radial-gradient(circle at 50% 0%, var(--green-mid) 0%, var(--green-deep) 62%);
  color: var(--warm-white);
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 {
  margin: 0 0 6px;
  font-size: 28px;
  letter-spacing: 3px;
  background: linear-gradient(180deg, var(--gold-light), #E8A33D);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub { margin: 0 0 24px; font-size: 13px; color: var(--gray-aux); }

.panel {
  padding: 20px;
  border-radius: 20px;
  background: linear-gradient(165deg, rgba(30, 90, 68, 0.72) 0%, rgba(8, 26, 21, 0.86) 100%);
  border: 1px solid rgba(245, 193, 92, 0.18);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
input {
  flex: 1 1 240px;
  min-width: 0;
  height: 46px;
  padding: 0 16px;
  font-size: 15px;
  color: #fff;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  outline: none;
}
input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 193, 92, 0.2); }
button {
  height: 46px;
  padding: 0 22px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--warm-white);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  background: linear-gradient(180deg, #12A07F, #0E8C6E);
  box-shadow: 0 4px 0 #0A6B54;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0A6B54; }
button.gold { background: linear-gradient(180deg, var(--gold), #E8A33D); color: #3A1D00; box-shadow: 0 4px 0 #B47F22; }
button.ghost { background: transparent; border: 1px solid rgba(255, 255, 255, 0.24); color: var(--gray-aux); box-shadow: none; }
button.danger { background: transparent; border: 1px solid rgba(255, 93, 93, 0.5); color: #FF9B9B; box-shadow: none; }
button.mini { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 999px; box-shadow: none; }
button:disabled { opacity: 0.5; cursor: default; }

.status { margin-top: 14px; font-size: 13px; color: var(--gray-aux); min-height: 18px; }
.status.err { color: #FF9B9B; }

/* 手机上四列按钮 + 六列表格一定放不下。横向滚动收在面板里，
 * 别让整页（连同标题和输入框）跟着一起横向溢出。 */
.table-scroll { margin-top: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.07); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--gray-aux); text-transform: uppercase; }
td.name { font-weight: 700; color: var(--gold-light); }
td.nick { color: var(--warm-white); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
td.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up-red); }
.down { color: var(--down-green); }
.off td { opacity: 0.45; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
.tag.ok { background: rgba(61, 220, 132, 0.16); color: var(--down-green); }
.tag.bad { background: rgba(255, 93, 93, 0.16); color: var(--up-red); }
.acts { display: flex; gap: 6px; }
.empty { padding: 40px 0; text-align: center; color: var(--gray-aux); }
.foot { margin-top: 22px; font-size: 12px; line-height: 1.7; color: rgba(184, 192, 204, 0.6); }
code { padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); font-size: 12px; }

/* 重置密码弹窗：**不用 prompt()**。
 * prompt 的输入框是明文显示、没有遮挡、没有二次确认、没有强度提示——
 * 管理员在公共场合帮朋友重置密码，旁边人一眼看完。
 * 这里给两个 masked 输入（新密码 / 再输一次），并在本地先校验一致。 */
.modal {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(4, 12, 9, 0.72);
  backdrop-filter: blur(6px);
}
.modal.hidden { display: none; }
.modal-box {
  width: 100%; max-width: 420px;
  padding: 24px;
  border-radius: 20px;
  background: linear-gradient(165deg, rgba(30, 90, 68, 0.96) 0%, rgba(8, 26, 21, 0.98) 100%);
  border: 1px solid rgba(245, 193, 92, 0.24);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
}
.modal-box h3 { margin: 0 0 8px; font-size: 20px; color: var(--gold-light); letter-spacing: 1px; }
.modal-box p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: var(--gray-aux); }
.modal-box input { flex: none; width: 100%; margin-bottom: 10px; }
.modal-box .acts { display: flex; gap: 10px; margin-top: 6px; }
.modal-box .acts button { flex: 1; }

/* 窄屏优先保住「谁、什么状态、能点哪个按钮」。
 * 场次和最后登录是可推断的次要信息，手机上直接收起来，省得横向拖。 */
@media (max-width: 620px) {
  body { padding: 20px 14px 44px; }
  h1 { font-size: 22px; letter-spacing: 2px; }
  .panel { padding: 14px; border-radius: 16px; }
  .col-games, .col-last { display: none; }
  th, td { padding: 9px 6px; }
  td.nick { max-width: 84px; }
  /* 四个按钮自由换行会散成参差的三行；固定 2×2 网格才整齐 */
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  button.mini { height: 30px; padding: 0 4px; font-size: 12px; }
  .acts button.mini { width: 100%; }
  button { padding: 0 16px; font-size: 14px; }
  input { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>六选五 · 用户管理</h1>
  <p class="sub">需要服务端那把备份密钥。密钥只存在这个标签页里，关掉即失效。</p>

  <div class="panel">
    <div class="row">
      <input id="key" type="password" placeholder="x-backup-key（服务端 server/backup-key.txt）" autocomplete="off">
      <button id="btn-load" class="gold">载入用户</button>
      <button id="btn-clear" class="ghost">清掉本页密钥</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="list-wrap" class="panel" style="margin-top:18px; display:none;">
    <div class="row" style="justify-content:space-between;">
      <div id="count" class="sub" style="margin:0;"></div>
      <button id="btn-reload" class="ghost mini">刷新</button>
    </div>
    <div id="table-wrap" class="table-scroll"></div>
  </div>

  <p class="foot">
    改昵称只动牌桌上显示的名字；账号名是登录凭据，不在这里改。<br>
    <b>清空排行榜</b>（战绩归零，账号和密码保留，大家照常登录）：<br>
    <code>curl -X POST "/api/admin/reset-stats" -H "x-backup-key: &lt;key&gt;"</code><br>
    <b>连账号一起清</b>（所有人无法登录、必须重新注册，只用于测试数据彻底清场）：<br>
    <code>curl -X POST "/api/admin/reset" -H "x-backup-key: &lt;key&gt;"</code>
  </p>
</div>

<!-- 重置密码：masked 输入 + 二次确认，替代原来的 prompt() -->
<div id="pw-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="pw-title">设置新密码</h3>
    <p id="pw-desc"></p>
    <input id="pw-1" type="password" autocomplete="new-password" placeholder="新密码（至少 6 位）">
    <input id="pw-2" type="password" autocomplete="new-password" placeholder="再输一次">
    <div class="acts">
      <button id="pw-ok" class="gold">确定</button>
      <button id="pw-cancel" class="ghost">取消</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY_STORE = 'lxw_admin_key';
  var list = [];

  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* 网关要求所有请求都带 sharecode（不带连 /api/health 都 403），
   * 本页用 ?sharecode=xxx 打开，所有请求自动带上。 */
  function apiURL(path) {
    var p = '/api' + path;
    var sc = new URLSearchParams(location.search || '').get('sharecode');
    if (sc) p += (p.indexOf('?') >= 0 ? '&' : '?') + 'sharecode=' + encodeURIComponent(sc);
    return p;
  }

  function key() { return $('#key').value.trim() || sessionStorage.getItem(KEY_STORE) || ''; }

  function setStatus(msg, isErr) {
    var el = $('#status');
    el.textContent = msg || '';
    el.className = 'status' + (isErr ? ' err' : '');
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    function p(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  async function call(method, path, body) {
    var headers = { 'x-backup-key': key() };
    var payload;
    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
      payload = JSON.stringify(body);
    }
    /* 必须整段 try/catch：断网时 fetch 直接抛异常，以前没人接 → unhandled rejection
     * → 界面毫无变化，用户只会觉得「点了没用」，还会反复点。 */
    var res, data = null;
    try {
      res = await fetch(apiURL(path), { method: method, headers: headers, body: payload, cache: 'no-store' });
      try { data = await res.json(); } catch (e) { /* 非 JSON 响应，下面按状态码兜底 */ }
    } catch (e) {
      return { ok: false, error: '网络异常，请检查连接后重试', network: true };
    }
    if (!data) return { ok: false, error: '服务返回异常（' + res.status + '）' };
    if (!res.ok) return { ok: false, error: data.error || ('HTTP ' + res.status) };
    return data;
  }

  /* ---------------- 重置密码弹窗（替代 prompt） ---------------- */
  var pwResolve = null;

  function askPassword(title, desc) {
    $('#pw-title').textContent = title;
    $('#pw-desc').textContent = desc;
    $('#pw-1').value = '';
    $('#pw-2').value = '';
    $('#pw-modal').classList.remove('hidden');
    setTimeout(function () { try { $('#pw-1').focus(); } catch (e) {} }, 30);
    return new Promise(function (resolve) { pwResolve = resolve; });
  }
  function closeAskPassword(val) {
    $('#pw-modal').classList.add('hidden');
    $('#pw-1').value = '';
    $('#pw-2').value = '';
    var r = pwResolve; pwResolve = null;
    if (r) r(val == null ? null : String(val));
  }
  function onSubmitPassword() {
    var a = $('#pw-1').value;
    var b = $('#pw-2').value;
    if (String(a).length < 6) { setStatus('密码至少 6 位', true); return; }
    if (a !== b) { setStatus('两次输入不一致', true); return; }
    closeAskPassword(a);
  }

  function render() {
    var wrap = $('#table-wrap');
    $('#count').textContent = '共 ' + list.length + ' 个账号';
    if (!list.length) {
      wrap.innerHTML = '<div class="empty">还没有账号。玩家在登录页注册后会出现在这里。</div>';
      return;
    }
    var rows = list.map(function (u) {
      var net = Number(u.totalNet) || 0;
      var netCls = net > 0 ? 'up' : (net < 0 ? 'down' : '');
      return '<tr' + (u.disabled ? ' class="off"' : '') + '>'
        + '<td class="name">' + esc(u.account) + '</td>'
        + '<td class="nick">' + esc(u.nickname || '—') + '</td>'
        + '<td class="num col-games">' + (u.games || 0) + '</td>'
        + '<td class="num ' + netCls + '">' + (net > 0 ? '+' : '') + net + '</td>'
        + '<td class="num col-last">' + fmtDate(u.lastLoginAt || u.createdAt) + '</td>'
        + '<td>' + (u.disabled ? '<span class="tag bad">已停用</span>' : '<span class="tag ok">正常</span>') + '</td>'
        + '<td><div class="acts">'
        + '<button class="mini ghost" data-act="nick" data-pid="' + esc(u.playerId) + '">改昵称</button>'
        + '<button class="mini ghost" data-act="pwd" data-pid="' + esc(u.playerId) + '">重置密码</button>'
        + '<button class="mini ghost" data-act="toggle" data-pid="' + esc(u.playerId) + '">' + (u.disabled ? '恢复' : '停用') + '</button>'
        + '<button class="mini danger" data-act="del" data-pid="' + esc(u.playerId) + '">删除</button>'
        + '</div></td></tr>';
    });
    wrap.innerHTML = '<table><thead><tr>'
      + '<th>账号</th><th>昵称</th><th class="col-games">场次</th><th>净胜</th>'
      + '<th class="col-last">最后登录</th><th>状态</th><th>操作</th>'
      + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
  }

  function findUser(pid) {
    for (var i = 0; i < list.length; i++) if (list[i].playerId === pid) return list[i];
    return null;
  }

  async function load() {
    if (!key()) { setStatus('先填密钥', true); return; }
    setStatus('载入中…');
    var r = await call('GET', '/admin/users');
    if (!r.ok) { setStatus(r.error || '载入失败', true); return; }
    list = r.list || [];
    sessionStorage.setItem(KEY_STORE, key());
    $('#list-wrap').style.display = 'block';
    setStatus('已载入 ' + list.length + ' 个账号');
    render();
  }

  async function act(kind, pid) {
    var u = findUser(pid);
    if (!u) return;

    if (kind === 'nick') {
      var nick = prompt('「' + u.account + '」的新昵称（最多 8 字）', u.nickname || '');
      if (nick == null) return;
      nick = nick.trim();
      if (!nick) { setStatus('昵称不能为空', true); return; }
      var r1 = await call('POST', '/admin/nickname', { playerId: pid, nickname: nick });
      setStatus(r1.ok ? '昵称已改为「' + nick + '」' : (r1.error || '修改失败'), !r1.ok);
      return load();
    }

    if (kind === 'pwd') {
      var pw = await askPassword('重置密码', '给「' + u.account + '」设一个新密码。设完他当前的登录态会立刻失效，需要用新密码重新登录。');
      if (pw == null) return;
      var r2 = await call('POST', '/admin/password', { playerId: pid, password: pw });
      setStatus(r2.ok ? '已重置「' + u.account + '」的密码' : (r2.error || '重置失败'), !r2.ok);
      return load();
    }

    if (kind === 'toggle') {
      var next = !u.disabled;
      var r3 = await call('POST', '/admin/disable', { playerId: pid, disabled: next });
      setStatus(r3.ok ? (next ? '已停用「' + u.account + '」，他现在登不进来' : '已恢复「' + u.account + '」') : (r3.error || '操作失败'), !r3.ok);
      return load();
    }

    if (kind === 'del') {
      if (!confirm('删除账号「' + u.account + '」及其全部战绩？\n不可恢复。')) return;
      var r4 = await call('POST', '/admin/delete', { playerId: pid });
      setStatus(r4.ok ? '已删除「' + u.account + '」' : (r4.error || '删除失败'), !r4.ok);
      return load();
    }
  }

  $('#btn-load').addEventListener('click', load);
  $('#key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  $('#btn-reload').addEventListener('click', load);
  $('#btn-clear').addEventListener('click', function () {
    sessionStorage.removeItem(KEY_STORE);
    $('#key').value = '';
    list = [];
    $('#list-wrap').style.display = 'none';
    setStatus('已清掉本页密钥');
  });
  $('#table-wrap').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (btn) act(btn.getAttribute('data-act'), btn.getAttribute('data-pid'));
  });

  /* 重置密码弹窗：确定 / 取消 / 回车提交 / 点遮罩关闭 */
  $('#pw-ok').addEventListener('click', onSubmitPassword);
  $('#pw-cancel').addEventListener('click', function () { closeAskPassword(null); });
  $('#pw-2').addEventListener('keydown', function (e) { if (e.key === 'Enter') onSubmitPassword(); });
  $('#pw-1').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#pw-2').focus(); });
  $('#pw-modal').addEventListener('click', function (e) {
    if (e.target === $('#pw-modal')) closeAskPassword(null);   // 点遮罩 = 取消
  });

  // 页面重开时若同一标签页还存着密钥，自动载入一次
  var saved = sessionStorage.getItem(KEY_STORE);
  if (saved) { $('#key').value = saved; load(); }
})();
</script>
</body>
</html>

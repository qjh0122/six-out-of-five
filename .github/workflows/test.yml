name: test

# 为什么要有这个：项目有 51 个测试文件、1700+ 项断言，但全靠手动 `npm test`。
# 这一轮 review 里两个真 bug 都是测试抓出来的（榜单缓存漏失效、协议无消息限流），
# 而测试的价值完全取决于它是否**一直在跑**。更直接的证据是：
# 之前用脚本往 package.json 的长链里插测试命令，有一批没插进去且静默失败，
# 结果那 7 套测试写完之后从来没被执行过 —— 没有 CI 就没人会发现。
#
# 现在测试入口是 scripts/run-tests.js（扫描目录），新测试只要放进
# pwa/test 或 server/test 就自动纳入，不会再有"忘了挂进去"这种失败模式。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 项目是零依赖的（没有 dependencies），刻意不跑 npm ci：
      # 既没有依赖要装，也避免 lock 文件缺失时直接失败。
      - name: 语法检查
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "语法错误：$f"; fail=1; }
          done < <(git ls-files '*.js')
          exit $fail

      - name: 全量测试
        run: |
          set +e
          npm test > /tmp/t.log 2>&1
          code=$?
          cat /tmp/t.log
          # ★ v128：把失败的文件提成 annotation。
          # 在此之前 CI 红的时候，check-run 上只有一句「Process completed with exit code 1」，
          # 想知道是哪条测试红的必须去翻几十万行的日志（而且没有 admin 权限连日志都下不了）。
          # 这跟 v127 修的是同一个病：**失败必须自己说出来是哪一条**。
          # 用 node 解析而不是 grep —— runner 的 C locale 下 grep 匹配不到 ✗ 这种多字节字符。
          if [ $code -ne 0 ]; then
            node -e "
              const fs = require('fs');
              const lines = fs.readFileSync('/tmp/t.log', 'utf8').split('\n');
              const bad = lines.filter((l) => /^\s+✗/.test(l));
              for (const l of bad) console.log('::error::' + l.trim());
              /* ★ 光有文件名还是得去翻日志 —— 把具体的 FAIL 断言也提出来（每个文件最多 4 条） */
              let n = 0;
              for (const l of lines) {
                if (/^\s*FAIL\b/.test(l)) { console.log('::error::  ' + l.trim()); n++; }
                if (n >= 4) break;
              }
              console.log('::error::失败 ' + bad.length + ' 个测试文件（详情见日志末尾「失败详情」段）');
            "
          fi
          exit $code

      # 测试产物（临时档案、.tmp）不该留在工作区；有残留多半说明某个测试没清干净，
      # 而"没清干净"正是下一次运行偶发失败的主要来源。
      # 这里只告警不失败：仓库里本来就可能有未跟踪的脚本产物，误伤比漏报更烦人。
      - name: 检查测试残留
        if: always()
        run: |
          leftovers="$(git status --porcelain -- '*.tmp' '*.corrupt-*' 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::warning::测试跑完后留下了临时文件，检查是否有测试没清理"
            echo "$leftovers"
          else
            echo "没有残留"
          fi

  # ────────────────────────────────────────────────────────────────────
  # 浏览器巡检（v110 加的，v128 补全 12 档）
  #
  # 为什么单独一个 job：45 个探针**一个都没在 CI 里**，全靠人记着跑。
  # 后果不是理论上的 —— v108 那次 4463 条断言全绿、CI 也全绿，
  # 但真浏览器里所有弹窗都是哑的（脚本没接上），没有一条单测能发现。
  #
  # 为什么以前挂不上去：41 个脚本硬编码了 Windows 的 Edge 路径，
  # 放到 Linux runner 上必然全红。现在由 scripts/probe-ci.js 在进程级
  # 把 spawn 重定向到探测到的浏览器，脚本一行没改。
  #
  # ★ v128：从「2 档」扩到「12 档」，并分 3 片并行。
  #
  #   为什么必须补：12 档里长期只跑 390×844 / 844×390，而**已知最容易断行的
  #   恰恰是更窄的 360×640** —— 历史上第一次出现「补 AI 队友」断行就是在 390。
  #   补跑的第一天就发现：360×640 上有 6 条「遮挡」，其中一条还是 v123
  #   刚加的「等人」按钮。查下来那 6 条是探针自己的假红（见下），
  #   但**这正是跑它才有机会分清真假**。
  #
  #   为什么不一次跑完：12 档约 13 分钟，反馈太慢，而且一个档位红了会把
  #   其余 11 档的结果一起埋掉。分 3 片 ≈ 每片 5 分钟，哪一族坏了标题上就能看到。
  #
  #   分片是「按族切」而不是按数量平均：
  #     iOS / 安卓 / 电脑 三族的失效方式不一样（安全区 vs 窄屏断行 vs 大留白），
  #     混在一起切，一片里三族各坏一条反而看不出规律。
  # ────────────────────────────────────────────────────────────────────
  ui-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 四档
            only: '390x844,844x390,430x932,932x430'
          - name: 安卓四档
            only: '360x640,360x800,800x360,915x412'
          - name: 电脑四档
            only: '1280x720,1920x947,960x1040,728x348'
          # R5 · 本批：320×568 独立分片。半角 x —— 全角 × 经过 YAML→env→Node
          # 会被改坏，曾「安静跑 0 个视口然后通过」（probe-ui-flow.js:982-990 的教训）。
          - name: 最小档 320×568
            only: '320x568'

    name: 浏览器巡检 · ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备浏览器与字体
        run: |
          # ★ 中文字体是必须的，不是锦上添花：
          # 巡检量的全是「文字撑开的留白 / 换行 / 热区尺寸」。Linux runner 默认
          # 没有中文字体，中文会渲染成方块或零宽 —— 那样所有尺寸断言都会偏移，
          # 结果是一堆「看起来是布局坏了」的假红。表情同理（fonts-noto-color-emoji）。
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji || true

          # ubuntu runner 通常自带 /usr/bin/google-chrome；没有才装。
          # chromium-browser 在 22.04 之后是 snap 包装，装不上就退到 chromium。
          if ! node -e "require('./scripts/lib/browser.js').findBrowser()" 2>/dev/null; then
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium || true
          fi
          node -e "console.log('浏览器：' + require('./scripts/lib/browser.js').findBrowser())" \
            || { echo "::error::找不到可用浏览器，巡检无法进行"; exit 1; }
          fc-list :lang=zh | head -3 || echo "::warning::没有装到中文字体" 

      - name: 全流程巡检 · ${{ matrix.name }}（13 屏 + 全部弹窗）
        env:
          ONLY: ${{ matrix.only }}
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-ui-flow.js > /tmp/ui.log 2>&1
          code=$?
          cat /tmp/ui.log
          # 分片自检：这一片必须真的跑满**它自己**配置的档数（R5「按分片期望数取」）。
          # 不能写死 4 —— 320×568 是独立分片，只配了 1 档，写死会立刻 exit 3 假红。
          # 期望数取自本片的 ONLY，而不是从 workflow 文本里抄一个常数。
          # 用 node 解析而不是 grep —— runner 的 C locale 下 grep 匹配不到多字节字符，
          # 上一轮就因此只看到一句「exit code 2」，日志里到底红在哪一句完全看不到。
          node -e "
            const t = require('fs').readFileSync('/tmp/ui.log', 'utf8');
            const m = t.match(/本轮视口 (\d+) 个/);
            const n = m ? Number(m[1]) : -1;
            const expected = process.env.ONLY.split(',').filter(Boolean).length;
            if (n !== expected) {
              console.error('::error::分片应跑 ' + expected + ' 档，实际 ' + (n < 0 ? '日志里没有「本轮视口」' : n) + ' —— ONLY=' + process.env.ONLY);
              process.exit(3);
            }
          "
          self=$?
          if [ $self -ne 0 ]; then exit $self; fi
          # 把硬问题提成 annotation：不开日志（或者没有仓库 admin 读日志）时，
          # 也能从 check-run 的 annotations 里直接看到是哪几条红了。
          if [ $code -ne 0 ]; then
            tail -12 /tmp/ui.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

  # ────────────────────────────────────────────────────────────────────
  # 端到端旅途（v110 加的，v128 从 ui-probe 里拆出来）
  #
  # 拆出来的理由：巡检分成 3 片之后，journey 挂在其中一片上会变成
  # 「只有那一族的片子挂了才跑」；挂 3 份又是白跑两遍。
  # 它本来就只需要一个浏览器，和分片无关。
  # ────────────────────────────────────────────────────────────────────
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备浏览器与字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji || true
          if ! node -e "require('./scripts/lib/browser.js').findBrowser()" 2>/dev/null; then
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium || true
          fi
          node -e "console.log('浏览器：' + require('./scripts/lib/browser.js').findBrowser())" \
            || { echo "::error::找不到可用浏览器，旅途无法进行"; exit 1; }
          fc-list :lang=zh | head -3 || echo "::warning::没有装到中文字体"

      - name: 端到端旅途（注册 → 建房 → 打完一局 → 结算）
        run: |
          set +e
          node scripts/probe-ci.js scripts/journey.js > /tmp/j.log 2>&1
          code=$?
          cat /tmp/j.log
          if [ $code -ne 0 ]; then
            tail -8 /tmp/j.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # ── 动效与焦点（v135）────────────────────────────────────────────
      # 挂在 journey 这个 job 上而不是巡检的 3 个分片里，有两个理由：
      #   1) 它只跑一个视口（1280×720），扔进分片会被三个分片各跑一遍；
      #   2) 它量的全是 computed style（transition-duration / outline /
      #      prefers-reduced-motion 的兜底），和"布局有没有坏"是两件事，
      #      红的时候不该跟巡检的结论混在一起。
      # 这里已经装好浏览器和中文字体，加一步几乎不增加耗时。
      - name: 动效与焦点（令牌解析 / 焦点环 / 按压回执 / 减少动效）
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-motion.js > /tmp/m.log 2>&1
          code=$?
          cat /tmp/m.log
          if [ $code -ne 0 ]; then
            tail -8 /tmp/m.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # 判定工具自验（AC-NB-26 / N-3）：先证明尺子准，才许拿它量别人。
      # 它同时挡 M8 变异 —— 采集器一旦改成「按文本采集」，这里立刻红并拒绝下结论。
      - name: 几何判定工具自验
        run: node tools/qa/geometry-selftest.js

      # ── 撤销条（v136）────────────────────────────────────────────────
      # 它验的是「破坏性动作之前的 5 秒里，数据到底还在不在」——
      # 这件事没有任何静态断言能证明：单测只能说"到点会调回调"，
      # 说不了"第 3 秒时记录还在屏幕上"。真浏览器里插一刀才有意义。
      - name: 撤销条（5 秒窗口内数据仍在 / 撤销还原 / 到点真清 / 离房广播时序）
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-undo.js > /tmp/u.log 2>&1
          code=$?
          cat /tmp/u.log
          # 本批：离开房间专项（[6] / [7]）必须**真的跑过**。
          # 只核退出码看不出「新断言压根没被执行」—— 那是 G1 类「写了没接进执行链」。
          # 用 node 解析而不是 grep：runner 的 C locale 下 grep 匹配不到多字节字符。
          node -e "
            const t = require('fs').readFileSync('/tmp/u.log', 'utf8');
            const need = ['[6] 离开房间', '[7] 离开房间', '广播到达', '250ms', 'leaveRoom 调用数',
                          '[8] 房间屏', '[9] 对局屏', '[10] 结算屏', '策略行', '已知代价'];
            const missing = need.filter(function(s){ return t.indexOf(s) < 0; });
            if (missing.length) {
              console.error('::error::离开房间专项断言没跑全：' + missing.join(' / '));
              process.exit(3);
            }
          "
          self=$?
          if [ $self -ne 0 ]; then exit $self; fi
          if [ $code -ne 0 ]; then
            tail -8 /tmp/u.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # 撤销条 · 320×568：N-1（结算屏锚点）与 N-2（策略行两行）两条缺陷都是
      # **窄屏专有**的 —— 只跑 390 会全绿。窄屏是遮挡最容易发生的地方，必须单跑一档。
      - name: 撤销条 · 320×568（三屏几何 + 策略行两行）
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-undo.js 320 568 > /tmp/u320.log 2>&1
          code=$?
          cat /tmp/u320.log
          node -e "
            const t = require('fs').readFileSync('/tmp/u320.log', 'utf8');
            const need = ['[8] 房间屏', '[9] 对局屏', '[10] 结算屏', '策略行', '最多 3 行'];
            const missing = need.filter(function(s){ return t.indexOf(s) < 0; });
            if (missing.length) {
              console.error('::error::320 档断言没跑全：' + missing.join(' / '));
              process.exit(3);
            }
          "
          self=$?
          if [ $self -ne 0 ]; then exit $self; fi
          if [ $code -ne 0 ]; then
            tail -8 /tmp/u320.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # ── 战绩页四态 + 错误三级（v137 build-states v1）─────────────────
      # 为什么必须真浏览器：这一批的主判据全是"看得见吗 / 点得到吗 / 发了几次请求"。
      #   ① 四态互斥（同时可见 ≤1）只有 checkVisibility + getBoundingClientRect 能答；
      #   ② 加载态"零按钮"要数容器里真实的 button；
      #   ③ 重试"只发一次"数的是 CDP 网络层的 requestWillBeSent，不数被测代码里的计数器；
      #   ④ 离线"不发请求"的增量必须是 0，这只能从网络层看；
      #   ⑤ 静默类"页面一个像素都不动"要逐字比较 innerText。
      # 两档都跑：390×844（竖屏主档）+ 800×360（横屏最小档，断行最容易红的地方）。
      - name: 战绩页四态 · 390×844
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-states.js 390 844 > /tmp/s1.log 2>&1
          code=$?
          cat /tmp/s1.log
          if [ $code -ne 0 ]; then
            tail -10 /tmp/s1.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      - name: 战绩页四态 · 800×360（横屏最小档）
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-states.js 800 360 > /tmp/s2.log 2>&1
          code=$?
          cat /tmp/s2.log
          if [ $code -ne 0 ]; then
            tail -10 /tmp/s2.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # 数字阶梯（v138）：两档都要跑 —— 竖屏 390 会命中 max-width:420 的媒体查询，
      # 横屏 800×360 会命中 #stage.ls 那一整套覆盖。只跑一档等于只验了一半的覆盖。
      - name: 数字阶梯 · 390×844
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-numbers.js 390 844 > /tmp/n1.log 2>&1
          code=$?
          cat /tmp/n1.log
          if [ $code -ne 0 ]; then
            tail -10 /tmp/n1.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      - name: 数字阶梯 · 800×360
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-numbers.js 800 360 > /tmp/n2.log 2>&1
          code=$?
          cat /tmp/n2.log
          if [ $code -ne 0 ]; then
            tail -10 /tmp/n2.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code

      # 数字阶梯 · 320×568（R5 四步同改之第 3 步）：与 :304-315 完全同构。
      # 320 同时命中 .compact-v 与 max-width:420，是 390×844 / 800×360 都不覆盖的组合；
      # 只加 VIEWPORTS 一行、不在这里挂探针，等于「新档从没被真跑」（AC-NB-23 / 24）。
      - name: 数字阶梯 · 320×568
        run: |
          set +e
          node scripts/probe-ci.js scripts/probe-numbers.js 320 568 > /tmp/n3.log 2>&1
          code=$?
          cat /tmp/n3.log
          if [ $code -ne 0 ]; then
            tail -10 /tmp/n3.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $code
